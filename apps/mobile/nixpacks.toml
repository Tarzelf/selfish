# Used when the Railway service root directory is apps/mobile.
[variables]
NIXPACKS_NODE_VERSION = "20"
CI = "1"
EXPO_NO_TELEMETRY = "1"
NODE_OPTIONS = "--max-old-space-size=4096"

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run serve:web"
