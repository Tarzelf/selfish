# Railway deployment of the Selfish web preview.
# Prefer the repo-root Dockerfile. This file is for a service
# whose root directory is apps/mobile.

[build]
builder = "NIXPACKS"
buildCommand = "npm ci --include=dev && npm run build"
nixpacksConfigPath = "nixpacks.toml"

[deploy]
startCommand = "npm run serve:web"
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
