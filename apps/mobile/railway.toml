# Railway deployment of the Selfish web preview.
# Always upload from this directory (apps/mobile), not the monorepo root:
#   RAILWAY_TOKEN=<project-token> railway up --detach --service selfish --environment production
# GitHub auto-deploys must use root directory apps/mobile or Railpack cannot find package.json.

[build]
buildCommand = "npm ci --include=dev && npx expo export --platform web"

[deploy]
startCommand = "npx serve dist -l ${PORT}"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
