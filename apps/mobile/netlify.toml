# Deploy the Expo web export to Netlify.
# From apps/mobile: npx expo export --platform web && npx netlify deploy --prod --dir dist

[build]
  command = "npx expo export --platform web"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
